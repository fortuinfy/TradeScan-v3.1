<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeScan v3.1</title>
    <link rel="stylesheet" href="Style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="top-header">
            <div class="brand-section">
                <h1 class="logo">TradeScan <span class="version">v3.1</span></h1>
                <p id="modeDescription">Multi-Mode Trading Assistant</p>
            </div>
            <div class="header-actions">
                <div id="dateTime" class="clock">--:--:--</div>
                <div id="screenshotContainer">
                    <button id="screenshotBtn" class="secondary-btn">📸 Grab a Screenshot</button>
                </div>
            </div>
        </header>

        <section class="mode-banner card">
            <h2 id="modeTitle">New Scan</h2>
            <div class="action-section">
                <button class="mode-btn active-mode" data-mode="new">New Scan (EOD)</button>
                <button class="mode-btn" data-mode="watchlist">Watchlist (Intraday)</button>
                <button class="mode-btn" data-mode="active">Active Trade</button>
            </div>
        </section>

        <main>
            <section class="card" id="coreTechnicals">
                <h3>Core Technicals</h3>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label for="stockName">Stock Name</label>
                        <input type="text" id="stockName" placeholder="e.g. RELIANCE">
                    </div>
                    <div class="input-group">
                        <label for="timeframe">Timeframe</label>
                        <select id="timeframe">
                            <option value="Daily">Daily</option>
                            <option value="15 Min">15 Min</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="ltp">LTP (Last Traded Price)</label>
                        <input type="number" id="ltp" step="any" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="ema20">EMA 20</label>
                        <input type="number" id="ema20" step="any" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="ema50">EMA 50</label>
                        <input type="number" id="ema50" step="any" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="rsi">RSI (14)</label>
                        <input type="number" id="rsi" step="any" placeholder="0.00">
                    </div>
                </div>
            </section>

            <section class="card hidden" id="watchlistSection">
                <h3>Watchlist Parameters</h3>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label for="wl-originalSetup">Original Setup (Lock)</label>
                        <select id="wl-originalSetup">
                            <option value="CB">Continuation Breakout (CB)</option>
                            <option value="PC">Pullback Continuation (PC)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="wl-triggerLow">Prev. Trigger Low</label>
                        <input type
